services:
  zybookauto:
    build: .
    container_name: zybookauto
    restart: unless-stopped
    ports:
      - "8765:8765"
      - "20030:20030"
    environment:
      PORT: "8765"
      ZYBOOKAUTO_DB: /data/zybookauto.db
      ZYBOOKAUTO_SECRET: ${ZYBOOKAUTO_SECRET:-change-me}
      ZYBOOKS_EMAIL: ${ZYBOOKS_EMAIL:-}
      ZYBOOKS_PASSWORD: ${ZYBOOKS_PASSWORD:-}
      ZYBOOKAUTO_MCP_HOST: 0.0.0.0
      ZYBOOKAUTO_MCP_PORT: "20030"
      ZYBOOKAUTO_MCP_TOKEN: ${ZYBOOKAUTO_MCP_TOKEN:?Set ZYBOOKAUTO_MCP_TOKEN in .env}
      ZYBOOKAUTO_MCP_PUBLIC_URL: ${ZYBOOKAUTO_MCP_PUBLIC_URL:-http://localhost:20030/mcp}
    volumes:
      - zybookauto-data:/data

volumes:
  zybookauto-data:
